<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#080b0e">
  <title>Last Light Outpost</title>
  <link rel="stylesheet" href="styles/base.css">
  <link rel="stylesheet" href="styles/scene.css">
  <link rel="stylesheet" href="styles/terminal.css">
  <link rel="stylesheet" href="styles/menu.css">
  <script type="module" src="src/app.js"></script>
</head>
<body>
  <main id="app">
    <section id="main-menu" aria-label="Main menu" hidden>
      <img data-menu-layer="space" alt="">
      <img data-menu-layer="mars" alt="">
      <img data-menu-layer="meteors" alt="">
      <nav class="menu-buttons" aria-label="Main menu">
        <button data-menu="new"></button>
        <button data-menu="continue" hidden></button>
        <button data-menu="load"></button>
        <button data-menu="settings"></button>
      </nav>
    </section>
    <div id="scene-viewport"><div id="scene" aria-label="火星前哨站内部"></div></div>
    <button id="terminal-toggle" aria-label="打开终端" aria-haspopup="dialog" aria-controls="terminal" aria-expanded="false" disabled>
      <img src="assets/scene/interior/outpost_console.png" alt="" draggable="false">
    </button>
    <div id="morning-veil" aria-hidden="true"><span id="sol-title"></span></div>
    <p id="notice" role="status" aria-live="polite" hidden></p>
  </main>
  <dialog id="terminal" aria-labelledby="terminal-title">
    <img class="console-frame" src="assets/scene/interior/outpost_console.png" alt="" draggable="false">
    <div class="terminal-shell">
      <header class="terminal-header"><h1 id="terminal-title"></h1><button id="terminal-close" aria-label="关闭终端">×</button></header>
      <div id="terminal-scroll" tabindex="0"><div id="terminal-content"></div></div>
      <footer class="terminal-footer"><button id="skip-typing" hidden>显示全文</button><label><input id="reduce-motion" type="checkbox"> <span id="motion-label">静态显示</span></label><button id="restart" hidden>重新开始</button></footer>
    </div>
  </dialog>
</body>
</html>
